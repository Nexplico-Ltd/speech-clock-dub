name: Bug report
description: Something does not work, or works worse than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of these details you can fill in, the easier it is to reproduce.
        **Please remove API keys and other secrets from anything you paste.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which video, and what did you click? A video URL helps a lot.
      placeholder: |
        1. Open https://www.youtube.com/watch?v=...
        2. Click "Dub (ja)"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions, or in extension/manifest.json.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 141 on Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: target-lang
    attributes:
      label: Target language (targetLang)
      options:
        - ja (Japanese)
        - en (English)
        - zh-TW (Traditional Chinese)
        - zh-CN (Simplified Chinese)
        - ko (Korean)
    validations:
      required: true
  - type: dropdown
    id: tts
    attributes:
      label: Text-to-speech
      options:
        - VOICEVOX
        - edge-tts bridge
        - Not relevant / not sure
    validations:
      required: true
  - type: input
    id: llm
    attributes:
      label: LLM model and server
      description: The model and the OpenAI-compatible server it runs on.
      placeholder: "Gemma 4 12B Q4 on the Unsloth service"
  - type: dropdown
    id: captions
    attributes:
      label: Where did the captions come from?
      options:
        - YouTube, manual captions
        - YouTube, auto-generated (ASR) captions
        - A file loaded with "Load captions"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Open the page console (F12 -> Console), filter for `ytd`, and paste the lines, together with the
        status text shown next to the button (for example `Error: ...`).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reloaded the extension and the YouTube tab, and the problem is still there.
          required: true
        - label: I removed API keys and other secrets from this report.
          required: true

name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How should it work? A sketch of the behaviour or of a setting is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other approaches, or workarounds you use today.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      description: See CONTRIBUTING.md for how to get started.
      options:
        - "No, I am only suggesting it"
        - "Yes, I would like to send a pull request"
        - "Maybe, with some guidance"
    validations:
      required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extension (syntax + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in extension/*.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: npm test

  bridge:
    name: edge-tts bridge (lint + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install edge-tts ruff
      - name: Lint
        run: ruff check tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

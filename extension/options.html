<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speech Clock Dub - Settings</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 12px; }
      @media (max-width: 480px) { label { grid-template-columns: 1fr; gap: 2px; } input, select, button { font-size: 16px; } }
      label { display: grid; grid-template-columns: 160px 1fr; gap: 8px; margin: 6px 0; align-items: center; }
      details { border-top: 1px solid #8884; margin-top: 12px; padding-top: 6px; }
      summary { cursor: pointer; font-weight: 600; }
      button { margin-top: 12px; }
      #profiles { border: 1px solid #8884; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
      #profiles button, #profiles select, #profiles input { margin: 4px 4px 0 0; }
    </style>
  </head>
  <body>
    <h1>Speech Clock Dub</h1>
    <div id="profiles">
      <strong>Profile</strong>
      <select id="profile"></select>
      <button id="load" type="button">Load</button>
      <button id="delete" type="button">Delete</button>
      <br />
      <input id="profileName" placeholder="Profile name" />
      <button id="saveAs" type="button">Save as profile</button>
      <br />
      <button id="export" type="button">Export file</button>
      <button id="import" type="button">Import file</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
      <p>Profiles hold everything except the API keys, which are shared by all profiles and never exported.
        Load fills the form below; press Save to apply it.</p>
    </div>
    <form id="form"></form>
    <button id="save">Save</button> <span id="msg"></span>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
